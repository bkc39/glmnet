name: Nix checks

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  flake-check:
    name: nix flake check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Evaluate every system's outputs
        if: runner.os == 'Linux'
        run: nix flake check --all-systems --no-build
      - name: Build native lib + Racket package, run tests, render docs
        run: nix flake check --print-build-logs

  resyntax:
    name: Resyntax lint
    runs-on: ubuntu-latest
    steps:
      # full history, so --local-git-repository finds the base commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Resyntax lint
        env:
          # a master push lints the empty diff: a skipped required check never reports
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}
          BASE_NAME: ${{ github.base_ref || 'master' }}
        run: nix develop .#ci --command scripts/resyntax-gate.sh "$BASE_REF" "$BASE_NAME"
